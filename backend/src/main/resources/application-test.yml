# Integration tests. The database comes from Testcontainers (@ServiceConnection),
# so no datasource settings are needed here.
spring:
  datasource:
    hikari:
      leak-detection-threshold: 20000   # a connection held for 20 s in a test is a leak; it is logged with the stack that took it
  mail:
    host: localhost
    port: 1025

management:
  server:
    port: 0                            # random port; tests read it from local.management.port

app:
  observability:
    gauge-cache-seconds: 0             # tests read gauges right after changing data
  email:
    preview-enabled: true
    sns:
      topic-arns: arn:aws:sns:ap-south-1:123456789012:amanah-ses-events
  scheduling:
    enabled: false                     # tests call the jobs directly; the cron must never fire mid-test
  cors:
    allowed-origins: http://localhost:5173
  auth:
    bcrypt-strength: 4                 # tests only; production uses 12
  rate-limit:                          # high so the shared test context is never throttled by accident
    login-per-ip-per-minute: 100000
    login-per-email-per-minute: 100000
    mfa-per-ip-per-minute: 100000
    forgot-password-per-ip-per-hour: 100000
    lead-per-ip-per-hour: 100000
    invite-view-per-ip-per-minute: 100000
    invite-register-per-ip-per-hour: 100000
    pay-view-per-ip-per-minute: 100000
