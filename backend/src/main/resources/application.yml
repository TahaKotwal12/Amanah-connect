# Shared defaults. Environment-specific values live in application-{local,test,prod}.yml.
# No profile is active by default on purpose: a missing SPRING_PROFILES_ACTIVE must fail
# fast (no datasource URL) instead of silently running with local settings.
spring:
  profiles:
    active: local
  application:
    name: amanah-connect-api
  datasource:
    hikari:
      pool-name: amanah-pool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 10000        # 10 s
      idle-timeout: 600000             # 10 min
      max-lifetime: 1500000            # 25 min; Neon closes idle connections, recycle before it does
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate               # schema changes only through Flyway migrations
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true
    connect-retries: 3                 # tolerate a Neon compute waking from suspend
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  mail:
    properties:
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000

server:
  port: 8080
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
    include-exception: false

management:
  server:
    port: 8081                         # private port: never published, never proxied to the internet
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      show-components: never
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db   # SMTP is deliberately not part of readiness
  health:
    mail:
      enabled: false
  info:
    build:
      enabled: true

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

app:
  cors:
    allowed-origins: []
  auth:
    # Secrets come from the environment only. They are optional in the local and test profiles (a
    # throwaway key is generated) and mandatory everywhere else (see AuthKeysConfig).
    jwt-secret: ${JWT_SECRET:}
    totp-enc-key: ${TOTP_ENC_KEY:}
    frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:5173}
  bootstrap:
    # First start only. Remove these two variables once the super admin exists.
    super-admin-email: ${BOOTSTRAP_SUPERADMIN_EMAIL:}
    super-admin-password: ${BOOTSTRAP_SUPERADMIN_PASSWORD:}
  platform:
    # Where new-lead notifications go. Blank = every active SUPER_ADMIN account.
    notification-email: ${PLATFORM_NOTIFICATION_EMAIL:}
  subscriptions:
    expiring-window-days: 30           # "EXPIRING" in lists means ending within this many days
    auto-suspend-enabled: false        # default is warn only: never suspend automatically unless turned on
    grace-days: 7                      # days after expiry before auto-suspension (only if enabled)
  scheduling:
    enabled: true
  imports:
    max-rows-per-file: 5000
    max-file-bytes: 2097152            # 2 MB
  rate-limit:
    login-per-ip-per-minute: 10
    login-per-email-per-minute: 5
    mfa-per-ip-per-minute: 10
    forgot-password-per-ip-per-hour: 5
    lead-per-ip-per-hour: 5
