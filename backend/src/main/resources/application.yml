# Shared defaults. Environment-specific values live in application-{local,test,prod}.yml.
# No profile is active by default on purpose: a missing SPRING_PROFILES_ACTIVE must fail
# fast (no datasource URL) instead of silently running with local settings.
spring:
  application:
    name: amanah-connect-api
  datasource:
    hikari:
      pool-name: amanah-pool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 10000        # 10 s
      idle-timeout: 600000             # 10 min
      max-lifetime: 1500000            # 25 min; Neon closes idle connections, recycle before it does
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate               # schema changes only through Flyway migrations
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true
    connect-retries: 3                 # tolerate a Neon compute waking from suspend
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  mail:
    properties:
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000

server:
  port: 8080
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
    include-exception: false

management:
  server:
    port: 8081                         # private port: never published, never proxied to the internet
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      show-components: never
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db   # SMTP is deliberately not part of readiness
  health:
    mail:
      enabled: false
  info:
    build:
      enabled: true

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

app:
  cors:
    allowed-origins: []
