# Local development against docker-compose.local.yml (Postgres 16 + Mailpit).
# These are throwaway defaults for a container that only listens on localhost.
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/amanah}
    username: ${DB_USER:amanah}
    password: ${DB_PASSWORD:amanah_local_only}
  flyway:
    url: ${FLYWAY_URL:${DB_URL:jdbc:postgresql://localhost:5432/amanah}}
    user: ${FLYWAY_USER:${DB_USER:amanah}}
    password: ${FLYWAY_PASSWORD:${DB_PASSWORD:amanah_local_only}}
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

app:
  cors:
    allowed-origins: ${ALLOWED_ORIGIN:http://localhost:5173}
