<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en" th:replace="~{mail/layout.html :: layout(~{::content})}">
<body>
<th:block th:fragment="content">
<h1 th:replace="~{mail/fragments.html :: heading('Your invoice is overdue')}"></h1>
<p th:replace="~{mail/fragments.html :: para(|Dear ${p.memberName},|)}"></p>
<p th:replace="~{mail/fragments.html :: para(|An invoice from ${p.communityName} has passed its due date and is still unpaid.|)}"></p>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="margin:0 0 20px;border:1px solid #E3DED0;border-radius:6px;">
<tr th:replace="~{mail/fragments.html :: row('Invoice', ${p.invoiceNo})}"></tr>
<tr th:replace="~{mail/fragments.html :: row('Balance due', ${fmt.m(p.balance, p.currency)})}"></tr>
<tr th:replace="~{mail/fragments.html :: row('Was due on', ${fmt.d(p.dueDate)})}"></tr>
<th:block th:if="${p.daysOverdue != null and p.daysOverdue != ''}">
<tr th:replace="~{mail/fragments.html :: row('Days overdue', ${p.daysOverdue})}"></tr>
</th:block>
</table>
<th:block th:if="${p.payLink != null}">
<table th:replace="~{mail/fragments.html :: button(${p.payLink}, 'Pay with UPI')}"></table>
<p th:replace="~{mail/fragments.html :: linkfallback(${p.payLink})}"></p>
</th:block>
<p th:replace="~{mail/fragments.html :: muted('If you have already paid, please let the community admin know so they can update your account.')}"></p>
</th:block>
</body>
</html>
