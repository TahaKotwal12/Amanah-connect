<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en" th:replace="~{mail/layout.html :: layout(~{::content})}">
<body>
<th:block th:fragment="content">
<h1 th:replace="~{mail/fragments.html :: heading(|Welcome to ${p.communityName}|)}"></h1>
<p th:replace="~{mail/fragments.html :: para(|Dear ${p.memberName},|)}"></p>
<p th:replace="~{mail/fragments.html :: para(|You are now a member of ${p.communityName}. We will use this email address to send you your bills, receipts and community news.|)}"></p>
<th:block th:if="${p.memberNo != null and p.memberNo != ''}">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="margin:0 0 20px;border:1px solid #E3DED0;border-radius:6px;">
<tr th:replace="~{mail/fragments.html :: row('Member number', ${p.memberNo})}"></tr>
</table>
</th:block>
<p th:replace="~{mail/fragments.html :: muted('Keep your member number handy when you contact the community.')}"></p>
</th:block>
</body>
</html>
