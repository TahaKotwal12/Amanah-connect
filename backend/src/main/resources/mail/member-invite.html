<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en" th:replace="~{mail/layout.html :: layout(~{::content})}">
<body>
<th:block th:fragment="content">
<h1 th:replace="~{mail/fragments.html :: heading(|Join ${p.communityName}|)}"></h1>
<p th:replace="~{mail/fragments.html :: para(|Hello${p.recipientName != null ? ' ' + p.recipientName : ''},|)}"></p>
<p th:replace="~{mail/fragments.html :: para(|${p.communityName} has invited you to register as a member. It only takes a minute.|)}"></p>
<th:block th:if="${p.link != null}">
<table th:replace="~{mail/fragments.html :: button(${p.link}, 'Complete your registration')}"></table>
<p th:replace="~{mail/fragments.html :: linkfallback(${p.link})}"></p>
</th:block>
<th:block th:if="${p.expiresAt != null and p.expiresAt != ''}">
<p th:replace="~{mail/fragments.html :: muted(|This invitation works until ${fmt.d(p.expiresAt)}.|)}"></p>
</th:block>
</th:block>
</body>
</html>
