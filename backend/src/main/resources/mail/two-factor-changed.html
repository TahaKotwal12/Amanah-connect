<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en" th:replace="~{mail/layout.html :: layout(~{::content})}">
<body>
<th:block th:fragment="content">
<h1 th:replace="~{mail/fragments.html :: heading(|Two-factor authentication ${p.action}|)}"></h1>
<p th:replace="~{mail/fragments.html :: para(|Hello ${p.fullName},|)}"></p>
<p th:replace="~{mail/fragments.html :: para(|Two-factor authentication on your Amanah Connect account was ${p.action}.|)}"></p>
<th:block th:if="${p.at != null and p.at != ''}">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="margin:0 0 20px;border:1px solid #E3DED0;border-radius:6px;">
<tr th:replace="~{mail/fragments.html :: row('When', ${p.at})}"></tr>
</table>
</th:block>
<div th:replace="~{mail/fragments.html :: notice('If this was not you, reset your password straight away and contact support.')}"></div>
</th:block>
</body>
</html>
