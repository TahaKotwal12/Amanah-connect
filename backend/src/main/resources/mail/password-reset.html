<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en" th:replace="~{mail/layout.html :: layout(~{::content})}">
<body>
<th:block th:fragment="content">
<h1 th:replace="~{mail/fragments.html :: heading('Reset your password')}"></h1>
<p th:replace="~{mail/fragments.html :: para(|Hello ${p.fullName},|)}"></p>
<p th:replace="~{mail/fragments.html :: para('We received a request to reset the password of your Amanah Connect account.')}"></p>
<th:block th:if="${p.link != null}">
<table th:replace="~{mail/fragments.html :: button(${p.link}, 'Choose a new password')}"></table>
<p th:replace="~{mail/fragments.html :: linkfallback(${p.link})}"></p>
</th:block>
<th:block th:if="${p.validForMinutes != null and p.validForMinutes != ''}">
<p th:replace="~{mail/fragments.html :: muted(|This link works for ${p.validForMinutes} minutes and can be used once.|)}"></p>
</th:block>
<p th:replace="~{mail/fragments.html :: muted('If you did not ask for this, you can ignore this email: your password stays the same.')}"></p>
</th:block>
</body>
</html>
