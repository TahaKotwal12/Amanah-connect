<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en" th:replace="~{mail/layout.html :: layout(~{::content})}">
<body>
<th:block th:fragment="content">
<h1 th:replace="~{mail/fragments.html :: heading('Your subscription ends soon')}"></h1>
<p th:replace="~{mail/fragments.html :: para(|The ${p.planName} subscription for ${p.communityName} ends on ${fmt.d(p.periodEnd)}${p.daysLeft != null ? ' (in ' + p.daysLeft + ' days)' : ''}.|)}"></p>
<p th:replace="~{mail/fragments.html :: para('To keep your community running without interruption, please renew before then. Contact us and we will help.')}"></p>
</th:block>
</body>
</html>
