<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en" th:replace="~{mail/layout.html :: layout(~{::content})}">
<body>
<th:block th:fragment="content">
<h1 th:replace="~{mail/fragments.html :: heading('Update on your complaint')}"></h1>
<p th:replace="~{mail/fragments.html :: para(|Dear ${p.memberName},|)}"></p>
<p th:replace="~{mail/fragments.html :: para(|${p.communityName} has an update on your complaint.|)}"></p>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="margin:0 0 20px;border:1px solid #E3DED0;border-radius:6px;">
<tr th:replace="~{mail/fragments.html :: row('Complaint', ${p.subject})}"></tr>
<tr th:replace="~{mail/fragments.html :: row('Status', ${#strings.capitalize(#strings.toLowerCase(#strings.replace(p.status, '_', ' ')))})}"></tr>
</table>
<th:block th:if="${p.message != null and p.message != ''}">
<div th:replace="~{mail/fragments.html :: quote(${p.message})}"></div>
</th:block>
<p th:replace="~{mail/fragments.html :: muted('If you have questions, contact the community admin using the details below.')}"></p>
</th:block>
</body>
</html>
