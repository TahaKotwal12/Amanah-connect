<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en" th:replace="~{mail/layout.html :: layout(~{::content})}">
<body>
<th:block th:fragment="content">
<h1 th:replace="~{mail/fragments.html :: heading(|${p.communityName} is active|)}"></h1>
<p th:replace="~{mail/fragments.html :: para('Your community is active. You can sign in and start managing members, billing and announcements.')}"></p>
<th:block th:if="${p.reason != null and p.reason != ''}">
<div th:replace="~{mail/fragments.html :: quote(${p.reason})}"></div>
</th:block>
</th:block>
</body>
</html>
