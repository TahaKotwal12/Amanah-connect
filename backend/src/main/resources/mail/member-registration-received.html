<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en" th:replace="~{mail/layout.html :: layout(~{::content})}">
<body>
<th:block th:fragment="content">
<h1 th:replace="~{mail/fragments.html :: heading('New registration request')}"></h1>
<p th:replace="~{mail/fragments.html :: para(|${p.applicantName} has asked to join ${p.communityName}.|)}"></p>
<th:block th:if="${p.reviewLink != null}">
<table th:replace="~{mail/fragments.html :: button(${p.reviewLink}, 'Review the request')}"></table>
<p th:replace="~{mail/fragments.html :: linkfallback(${p.reviewLink})}"></p>
</th:block>
<p th:replace="~{mail/fragments.html :: muted('Approve or reject it from the registrations page.')}"></p>
</th:block>
</body>
</html>
