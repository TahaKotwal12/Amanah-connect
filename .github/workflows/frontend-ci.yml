name: Frontend CI

on:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: frontend

jobs:
  verify:
    name: Lint, types, unit tests, build, bundle budget
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Lint (ESLint, zero warnings)
        run: npm run lint

      - name: Unit and component tests (includes axe checks of every shared component)
        run: npm test

      - name: Build (type check + production bundle)
        run: npm run build

      # The JavaScript needed for the first signed-in screen must stay under 250 KB gzip.
      - name: Bundle budget
        run: npm run check:bundle

      - name: Upload the build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  e2e:
    name: End-to-end and accessibility (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Install the browser
        run: npx playwright install --with-deps chromium

      # Everything except the opt-in suites: `live-*` and live.spec.ts need a real backend, and
      # lighthouse.spec.ts runs in its own job (it needs a quiet machine for honest timings).
      # Playwright starts `npm run build && npm run preview` itself.
      - name: Run the end-to-end suite (includes axe on every route and the responsive checks)
        run: npx playwright test --grep-invert "lighthouse" --reporter=list,html
        env:
          CI: "true"

      - name: Upload the Playwright report and axe results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/reports/axe
          retention-days: 14

  lighthouse:
    name: Lighthouse (landing, login, both dashboards)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Install the browser
        run: npx playwright install --with-deps chromium

      # One test at a time against the production build; fails when a score is under its threshold.
      - name: Lighthouse
        run: npm run lighthouse
        env:
          CI: "true"

      - name: Add the scores to the job summary
        if: always()
        run: |
          if [ -f reports/lighthouse/summary.md ]; then
            { echo "### Lighthouse (mobile)"; cat reports/lighthouse/summary.md; } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload the Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: frontend/reports/lighthouse
          retention-days: 14
