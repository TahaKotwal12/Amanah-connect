name: Backend CI

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
  schedule:
    - cron: "17 3 * * *"          # nightly: new CVEs appear even when we do not change anything

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, test, coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # CI mode = the normal build plus the coverage floor (75% of lines in *Service classes, see pom.xml).
      # Integration tests start PostgreSQL through Testcontainers; Docker is preinstalled on ubuntu-latest.
      - name: Build, test and check coverage
        run: ./mvnw --batch-mode --no-transfer-progress -Pci verify

      - name: Coverage summary
        if: always()
        run: |
          if [ -f target/site/jacoco/jacoco.csv ]; then
            awk -F, 'NR>1 { m+=$8; c+=$9 } END { if (m+c>0) printf "### Line coverage (all classes): %.1f%%\n", 100*c/(m+c) }' target/site/jacoco/jacoco.csv >> "$GITHUB_STEP_SUMMARY"
            awk -F, 'NR>1 && $3 ~ /Service$/ { m+=$8; c+=$9 } END { if (m+c>0) printf "### Line coverage (*Service classes, floor 75%%): %.1f%%\n", 100*c/(m+c) }' target/site/jacoco/jacoco.csv >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/target/site/jacoco

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            backend/target/surefire-reports
            backend/target/failsafe-reports

  dependency-check:
    name: OWASP dependency-check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Cache the vulnerability database
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: dependency-check-${{ github.run_id }}
          restore-keys: dependency-check-

      # Fails the build on any known vulnerability scored CVSS 7 or higher in a runtime dependency.
      # NVD_API_KEY (repository secret) makes the database download fast and reliable; without it the job is slow and may be rate limited.
      - name: Scan dependencies
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: ./mvnw --batch-mode --no-transfer-progress -Psecurity -DskipTests -DskipITs -Djacoco.skip=true verify

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: backend/target/dependency-check-report.*
