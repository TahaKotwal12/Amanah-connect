name: Deploy UAT

# Every push to main redeploys the UAT server: the server pulls the code, rebuilds and restarts.
# Needs three repository secrets (Settings > Secrets and variables > Actions):
#   EC2_HOST      the server address
#   EC2_USER      ubuntu
#   EC2_SSH_KEY   the private key of a key pair that is allowed to log in to the server
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-uat
  cancel-in-progress: false      # never cut a running deploy in half

jobs:
  deploy:
    name: Deploy to the UAT server
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # The server is switched off when nobody is using it (see control-panel/). A deploy then has
      # nothing to talk to: say so and stop cleanly. The server updates itself when it is next started.
      - name: Is the server on?
        id: reach
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          if timeout 15 bash -c "cat < /dev/null > /dev/tcp/$EC2_HOST/22" 2>/dev/null; then
            echo "up=true" >> "$GITHUB_OUTPUT"
          else
            echo "up=false" >> "$GITHUB_OUTPUT"
            echo "::notice::The UAT server is off, so nothing was deployed. It will pick up this code the next time it is started."
          fi

      - name: Prepare SSH
        if: steps.reach.outputs.up == 'true'
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Pull, build and restart on the server
        if: steps.reach.outputs.up == 'true'
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key -o ServerAliveInterval=30 "$EC2_USER@$EC2_HOST" \
            "bash ~/app/deploy/deploy.sh"
