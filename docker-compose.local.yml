# Local development services. Not for production (see deploy/ for that).
#   docker compose -f docker-compose.local.yml up -d
# Ports are bound to 127.0.0.1 so nothing is reachable from other machines.
services:
  postgres:
    image: postgres:16-alpine
    container_name: amanah-postgres
    environment:
      POSTGRES_DB: amanah
      POSTGRES_USER: amanah
      POSTGRES_PASSWORD: ${LOCAL_POSTGRES_PASSWORD:-amanah_local_only}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - amanah-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U amanah -d amanah"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    container_name: amanah-mailpit
    ports:
      - "127.0.0.1:1025:1025"   # SMTP
      - "127.0.0.1:8025:8025"   # web UI
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible storage for logos, attachments and receipt PDFs. The browser uploads straight to it with signed URLs,
  # exactly as it does to S3 in production. Console: http://localhost:9001 (user amanah).
  minio:
    image: minio/minio:latest
    container_name: amanah-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: amanah
      MINIO_ROOT_PASSWORD: ${LOCAL_MINIO_PASSWORD:-amanah_local_only}
      MINIO_API_CORS_ALLOW_ORIGIN: ${ALLOWED_ORIGIN:-http://localhost:5173}
    ports:
      - "127.0.0.1:9000:9000"   # S3 API
      - "127.0.0.1:9001:9001"   # console
    volumes:
      - amanah-miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_PASSWORD: ${LOCAL_MINIO_PASSWORD:-amanah_local_only}
    entrypoint: >
      /bin/sh -c "mc alias set local http://minio:9000 amanah $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing local/amanah-local &&
      echo bucket amanah-local ready"
    restart: "no"

volumes:
  amanah-pgdata:
  amanah-miniodata:
